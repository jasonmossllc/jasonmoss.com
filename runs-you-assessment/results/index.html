<html lang="en">

<style>
  :root{
    --obsidian:#1D1F1E;
    --obsidian-deep:#141615;
    --forest:#2C3F36;
    --mocha:#5B4B3F;
    --taupe:#8C837A;
    --gold:#C2A86C;
    --gold-dark:#b89a5e;
    --stone:#E9E2D3;
    --sand:#F8F6F2;
    --serif:'Libre Baskerville', Georgia, serif;
    --sans:'Raleway', 'Helvetica Neue', sans-serif;
    --ease:cubic-bezier(0.16, 1, 0.3, 1);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:var(--sans); color:var(--sand);
    background:var(--obsidian); -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    font-size:18px; line-height:1.75; font-weight:400;
  }
  img{ max-width:100%; display:block; }
  ::selection{ background:rgba(194,168,108,.35); color:var(--sand); }
  .bg-pale ::selection{ color:var(--obsidian); }
  .wrap{ max-width:820px; margin:0 auto; padding:0 28px; }

  /* ---------- type ---------- */
  h1,h2{ font-family:var(--serif); font-weight:400; margin:0; text-wrap:balance; }
  h1{ font-size:clamp(38px,5.6vw,66px); line-height:1.12; letter-spacing:-.02em; }
  h2{ font-size:clamp(27px,3.6vw,40px); line-height:1.22; letter-spacing:-.01em; }
  .eyebrow{
    font-size:11px; letter-spacing:.30em; text-transform:uppercase; font-weight:600;
    color:var(--gold); margin:0 0 20px;
  }
  .divider{ width:56px; height:1px; background:var(--gold); opacity:.55; border:0; margin:0 0 26px; }
  .stack p{ margin:0 0 22px; max-width:62ch; text-wrap:pretty; }
  .stack p.open{
    font-family:var(--serif); font-size:clamp(20px,2.4vw,24px); line-height:1.55;
    color:var(--sand); margin-bottom:26px;
  }
  .stack p:last-child{ margin-bottom:0; }
  .stack h2{ margin:0 0 34px; }
  .pull{
    font-family:var(--serif); font-style:italic; font-size:clamp(21px,2.6vw,26px);
    line-height:1.5; color:var(--gold); margin-top:34px !important;
  }
  .bg-pale .stack p{ color:#3a3c3b; }

  /* ---------- textured grounds ---------- */
  .bg-forest{
    background:
      linear-gradient(180deg, rgba(44,63,54,.84), rgba(31,45,39,.94)),
      url('../assets/section-bg-forest.jpg') center / cover no-repeat,
      var(--forest);
  }
  .bg-charcoal{
    background:
      linear-gradient(180deg, rgba(29,31,30,.88), rgba(20,22,21,.96)),
      url('../assets/section-bg-forest.jpg') center / cover no-repeat,
      var(--obsidian);
  }
  .bg-pale{
    background:
      linear-gradient(180deg, rgba(248,246,242,.90), rgba(248,246,242,.96)),
      url('../assets/section-bg-pale.jpg') center / cover no-repeat,
      var(--sand);
    color:var(--obsidian);
  }
  section{ padding:120px 0; position:relative; }
  .hairline-b{ border-bottom:1px solid rgba(194,168,108,.14); }
  .glow:before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 62% 42% at 50% 0%, rgba(194,168,108,.08) 0%, transparent 70%);
  }
  .glow > *{ position:relative; }

  /* ---------- buttons ---------- */
  .btn{
    display:inline-block; background:var(--gold); color:var(--obsidian);
    font-family:var(--sans); font-weight:600; font-size:15px; letter-spacing:.04em;
    padding:20px 46px; border:0; border-radius:0; text-decoration:none; cursor:pointer;
    transition:background .2s var(--ease), transform .2s var(--ease), box-shadow .2s var(--ease);
  }
  .btn .arr{ display:inline-block; transition:transform .25s var(--ease); margin-left:10px; }
  .btn:hover{
    background:var(--gold-dark); transform:translateY(-1px);
    box-shadow:0 16px 34px -14px rgba(194,168,108,.45);
  }
  .btn:hover .arr{ transform:translateX(4px); }
  .btn:focus-visible{ outline:2px solid var(--sand); outline-offset:3px; }
  .microcta{ font-size:13.5px; color:var(--taupe); margin:18px 0 0; letter-spacing:.05em; }

  /* ============ VERDICT HERO ============ */
  .verdict{
    position:relative; min-height:100vh; min-height:100svh;
    display:flex; flex-direction:column; overflow:hidden; text-align:center;
    background:
      linear-gradient(180deg, rgba(20,22,21,.80) 0%, rgba(24,28,26,.76) 45%, rgba(20,22,21,.92) 100%),
      url('../assets/section-bg-forest.jpg') center / cover no-repeat,
      url('../assets/forest-bg.jpg') center 30% / cover no-repeat,
      var(--obsidian-deep);
    background-blend-mode: normal, soft-light, normal;
  }
  .verdict:before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(ellipse 70% 45% at 50% 8%, rgba(194,168,108,.13) 0%, transparent 70%),
      radial-gradient(ellipse 130% 90% at 50% 50%, transparent 58%, rgba(14,16,15,.5) 100%);
  }
  .verdict:after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:160px; pointer-events:none;
    background:linear-gradient(180deg, transparent, var(--obsidian-deep));
  }
  .verdict .topbar{
    position:relative; z-index:3; display:flex; justify-content:center; padding:34px 24px 0;
  }
  .verdict .topbar img{ height:30px; width:auto; }
  .verdict-main{
    position:relative; z-index:2; flex:1; display:flex; align-items:center; justify-content:center;
    padding:44px 28px 90px;
  }
  .verdict-inner{ max-width:900px; }
  .verdict .eyebrow{ margin-bottom:34px; }
  .verdict h1{ text-shadow:0 2px 44px rgba(0,0,0,.4); }
  .verdict h1 .l1{ display:block; color:var(--sand); }
  .verdict h1 .l2{ display:block; font-style:italic; color:var(--gold); margin-top:10px; }
  .verdict .vsub{
    font-size:17px; line-height:1.7; color:rgba(233,226,211,.72);
    max-width:520px; margin:32px auto 0; font-weight:300;
  }

  /* severity dial */
  .dial{ margin:0 auto 40px; width:min(320px, 78vw); position:relative; }
  .dial svg{ display:block; width:100%; height:auto; overflow:visible; }
  .dial .arc-bg{ stroke:rgba(194,168,108,.16); }
  .dial .arc-fill{
    stroke:url(#dialGrad); filter:drop-shadow(0 0 6px rgba(194,168,108,.35));
  }
  .dial .tick{ stroke:rgba(233,226,211,.22); }
  .dial .marker{
    fill:var(--gold); filter:drop-shadow(0 0 8px rgba(194,168,108,.7));
  }
  .dial-center{
    position:absolute; left:0; right:0; bottom:34px; text-align:center; pointer-events:none;
  }
  .dial-center .dc-label{
    display:block; font-size:10px; letter-spacing:.30em; text-transform:uppercase;
    font-weight:600; color:var(--taupe); margin-bottom:4px;
  }
  .dial-center .dc-tier{
    display:block; font-family:var(--serif); font-style:italic;
    font-size:clamp(25px,3.6vw,32px); line-height:1.1; color:var(--gold);
    text-shadow:0 0 30px rgba(194,168,108,.35);
  }
  .dial-ends{
    display:flex; justify-content:space-between; margin-top:10px;
    font-size:10px; letter-spacing:.22em; text-transform:uppercase; font-weight:600;
    color:rgba(140,131,122,.85);
  }

  /* scroll cue */
  .scrollcue{
    position:absolute; left:0; right:0; bottom:30px; margin:0 auto; width:max-content; z-index:3;
    background:none; border:0; cursor:pointer; padding:10px;
  }
  .scrollcue span{
    display:block; width:14px; height:14px;
    border-left:1px solid rgba(194,168,108,.8); border-bottom:1px solid rgba(194,168,108,.8);
    transform:rotate(-45deg);
  }
  @media (prefers-reduced-motion:no-preference){
    .scrollcue span{ animation:cue 2.2s ease-in-out infinite; }
    @keyframes cue{ 0%,100%{ transform:rotate(-45deg) translate(0,0); opacity:.85; } 50%{ transform:rotate(-45deg) translate(-5px,5px); opacity:.35; } }
  }

  /* hero entrance + scroll reveals */
  @media (prefers-reduced-motion:no-preference){
    .verdict .topbar, .verdict .eyebrow, .dial, .verdict h1, .verdict .vsub, .scrollcue{
      opacity:0; transform:translateY(18px);
      animation:rise 1s var(--ease) forwards;
    }
    .verdict .topbar{ animation-delay:.05s; }
    .verdict .eyebrow{ animation-delay:.2s; }
    .dial{ animation-delay:.35s; }
    .verdict h1{ animation-delay:.55s; }
    .verdict .vsub{ animation-delay:.75s; }
    .scrollcue{ animation-delay:1.1s; }
    @keyframes rise{ to{ opacity:1; transform:none; } }
    html.js .reveal{ opacity:0; transform:translateY(22px); transition:opacity .9s var(--ease), transform .9s var(--ease); }
    html.js .reveal.in{ opacity:1; transform:none; }
  }

  /* ============ MIRROR ============ */
  .mirror-quote{
    font-family:var(--serif); font-size:clamp(21px,2.8vw,28px); line-height:1.65;
    color:var(--sand); max-width:28em; margin:0 0 30px;
  }
  .mirror-quote b{ color:var(--gold); font-weight:400; font-style:italic; }

  /* ============ REASONS ============ */
  .reasons{ counter-reset:r; list-style:none; margin:44px 0 0; padding:0; max-width:660px; }
  .reasons li{
    position:relative; padding:30px 0 30px 68px;
    border-bottom:1px solid rgba(194,168,108,.14);
  }
  .reasons li:last-child{ border-bottom:0; }
  .reasons li:before{
    counter-increment:r; content:counter(r);
    position:absolute; left:0; top:28px; width:42px; height:42px;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--serif); font-size:19px; color:var(--gold);
    border:1px solid rgba(194,168,108,.45);
  }
  .reasons b{ display:block; font-family:var(--serif); font-weight:400; font-size:21px; color:var(--sand); margin:0 0 8px; line-height:1.4; }
  .reasons p{ margin:0; color:rgba(233,226,211,.8); font-size:16.5px; line-height:1.7; }

  /* ============ COST ============ */
  .costline{
    font-family:var(--serif); font-size:clamp(26px,3.8vw,40px); line-height:1.35;
    margin:34px 0 0 !important; color:var(--sand);
  }
  .costline em{ color:var(--gold); }
  .cost-beats{ margin:42px 0 0; max-width:560px; }
  .cost-beats p{
    font-family:var(--serif); font-size:clamp(19px,2.3vw,23px); line-height:1.6;
    color:rgba(233,226,211,.92); margin:0 0 30px; padding-left:26px;
    border-left:1px solid rgba(194,168,108,.5);
  }
  .cost-beats p:last-child{ margin-bottom:0; }

  /* ============ BOOK CARD ============ */
  .bookcard{
    position:relative; background:#fff; margin:54px auto 0; padding:52px 44px 44px;
    border:1px solid rgba(140,131,122,.25);
    box-shadow:
      0 2px 8px -2px rgba(29,31,30,.12),
      0 18px 50px -18px rgba(194,168,108,.28),
      0 44px 90px -40px rgba(29,31,30,.55);
    max-width:660px;
  }
  .bookcard:before{ /* gold diamond on the top edge — bookends the hero ornament */
    content:""; position:absolute; top:-7px; left:50%; width:13px; height:13px;
    background:var(--gold); transform:translateX(-50%) rotate(45deg);
    box-shadow:0 0 0 5px #fff;
  }
  .bookcard .corner{ position:absolute; width:46px; height:46px; pointer-events:none; }
  .bookcard .corner.tl{ top:-1px; left:-1px; border-top:2px solid var(--gold); border-left:2px solid var(--gold); }
  .bookcard .corner.br{ bottom:-1px; right:-1px; border-bottom:2px solid var(--gold); border-right:2px solid var(--gold); }
  .bookcard .btn{ display:block; width:100%; text-align:center; }
  .bookcard p{ color:#3a3c3b; margin:0 0 18px; }
  .bookcard p:first-of-type{ font-family:var(--serif); font-size:22px; color:var(--obsidian); }
  .bookcard .btn{ padding:22px 54px; font-size:16px; }
  .bookcard .microcta{ color:var(--taupe); margin-top:26px; text-align:center; }
  .bookcard .stakes{
    font-family:var(--serif); font-style:italic; color:var(--mocha);
    border-top:1px solid rgba(140,131,122,.25); padding-top:20px; margin-top:24px;
  }
  .booked-note{ display:none; font-family:var(--serif); font-size:19px; color:var(--forest); margin:8px 0 0; }
  .booked-note.show{ display:block; }

  /* ============ PROOF ============ */
  .jm-face{
    width:96px; height:96px; border-radius:50%; object-fit:cover;
    border:1px solid rgba(194,168,108,.55); margin:0 0 30px;
    box-shadow:0 10px 34px -12px rgba(0,0,0,.6);
  }
  .stack p b{ color:var(--gold); font-weight:400; }
  .trustlogos{ text-align:center; margin:84px auto 0; padding:0 24px; }
  .tl-row.tl-row2{ margin:16px auto 0; }
  .tl-row{
    display:flex; align-items:center; justify-content:center; flex-wrap:wrap;
    gap:14px 44px; max-width:860px; margin:0 auto;
  }
  .tl-row img{ height:17px; width:auto; opacity:.38; filter:brightness(0) invert(1); }
  .tl-label{
    display:block; font-size:10px; letter-spacing:.30em; text-transform:uppercase;
    color:rgba(140,131,122,.85); margin:0 0 20px; font-weight:600;
  }
  .testi{
    display:flex; align-items:flex-start; gap:20px; margin:36px 0 0;
    padding:26px 28px; background:rgba(20,22,21,.35);
    border:1px solid rgba(194,168,108,.25);
  }
  .testi img{
    width:64px; height:64px; border-radius:50%; object-fit:cover;
    border:1px solid rgba(194,168,108,.55); flex-shrink:0;
  }
  .testi .t-text{
    font-family:var(--serif); font-size:17.5px; line-height:1.65;
    color:rgba(233,226,211,.92); margin:0 0 10px; max-width:52ch;
  }
  .testi .t-text b{ color:var(--gold); font-weight:400; }
  .testi .t-who{
    font-size:11px; letter-spacing:.22em; text-transform:uppercase; font-weight:600;
    color:var(--taupe); margin:0;
  }

  footer{
    text-align:center; padding:54px 24px 120px; background:var(--obsidian-deep);
    border-top:1px solid rgba(194,168,108,.14);
  }
  footer img{ height:26px; margin:0 auto 16px; opacity:.85; }
  footer p{ color:rgba(140,131,122,.5); font-size:10.5px; margin:0 0 6px; letter-spacing:.05em; }
  footer p:last-child{ margin-bottom:0; }
  footer a{ color:rgba(140,131,122,.6); text-decoration:underline; text-underline-offset:3px; }
  footer a:hover{ color:var(--gold); }

  /* ============ STICKY BOOK BAR ============ */
  .stickybar{
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    background:rgba(37,54,46,.92);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border-top:1px solid rgba(194,168,108,.35);
    display:flex; align-items:center; justify-content:center; gap:26px; flex-wrap:wrap;
    padding:13px 22px; transform:translateY(115%); transition:transform .35s var(--ease);
  }
  .stickybar.show{ transform:none; }
  .stickybar .t{ font-family:var(--serif); font-size:15px; color:var(--sand); }
  .stickybar .t b{ color:var(--gold); font-weight:400; font-style:italic; }
  .stickybar .btn{ padding:14px 30px; font-size:13.5px; }

  /* ============ MOBILE ============ */
  @media (max-width:780px){
    section{ padding:78px 0; }
    .verdict-main{ padding:30px 24px 80px; }
    .verdict .vsub{ font-size:15.5px; margin-top:26px; }
    .stickybar .t{ display:none; }
    .btn{ white-space:nowrap; padding:18px 26px; font-size:14px; }
    .cost-beats p{ padding-left:20px; margin-bottom:26px; }
    .trustlogos{ margin-top:60px; }
    .tl-row{ gap:12px 26px; }
    .tl-row img{ height:13px; }
  }
</style>

  <main id="results"></main>

  <script>
  (function(){
    'use strict';

    var FN_URL = '/.netlify/functions/submit-assessment';
    var CALENDLY_URL = 'https://calendly.com/jasonmoss/business-assessment-call-with-jason-moss';
    var YOUTUBE_URL = 'https://www.youtube.com/@jasonmossofficial';
    var ASSESSMENT_URL = '/runs-you-assessment/';

    window.dataLayer = window.dataLayer || [];
    // Analytics only on the live domain — localhost / deploy previews stay
    // out of the funnel data.
    var IS_LIVE = location.hostname === 'jasonmoss.com';
    function gtag(){ window.dataLayer.push(arguments); }
    if (IS_LIVE){
      gtag('js', new Date());
      // direct GA4 hookup — GTM keeps owning page_view, we send funnel events
      gtag('config', 'G-P5D1GH2M97', { send_page_view: false });
    }
    function track(eventName, extra){
      var payload = { event: eventName };
      if (extra) for (var k in extra) payload[k] = extra[k];
      window.dataLayer.push(payload);   // GTM-style (Meta/GTM triggers)
      if (IS_LIVE) gtag('event', eventName, extra || {});  // straight to GA4
    }
    function esc(s){
      return String(s).replace(/[&<>"']/g, function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      });
    }

    /* ── read + validate params ─────────────────────────────────────── */
    var REVENUE = { '0-5k':1, '5-10k':1, '10-25k':1, '25-50k':1, '50k-plus':1 };
    var HOURS_POINTS = { 'under-40':1, '40-50':2, '50-60':3, '60-plus':4 };
    var VAC_POINTS = { '3-months':1, '6-months':2, 'over-year':3, 'cant-remember':4 };
    var MIRROR = {
      q3: { 'under-40':'under 40', '40-50':'40–50', '50-60':'50–60', '60-plus':'60+' },
      q4: { '1':'it would run fine without you', '2':'a few things would slip',
            '3':'things would start breaking', '4':'it would grind to a halt',
            '5':'honestly — it’d fall apart' },
      q5: { '3-months':'in the last 3 months', '6-months':'in the last 6 months',
            'over-year':'over a year ago', 'cant-remember':'' },
      q6: { health:'your health', marriage:'your marriage',
            kids:'your time with your kids', friendships:'your friendships',
            identity:'who you are outside the business' }
    };
    // Each beat renders as its own line — spaced, not one run-on paragraph.
    var COST_BEATS = {
      health: [
        'The 2am wake-ups, chest tight over something that won’t matter in a year.',
        'Your body has been sending you the bill for a while now.',
        'You keep paying it late.'
      ],
      marriage: [
        'Lying in the same bed, answering one more message, while they fall asleep alone next to you.',
        'They’ve stopped fighting for your attention.',
        'That’s worse than the fighting.'
      ],
      kids: [
        '“One sec, buddy” is the thing you say most now.',
        'One day they stop asking you to come look.',
        'Not because they’re upset — because they’ve learned.'
      ],
      friendships: [
        'When’s the last time someone called you just to talk?',
        'Nobody left. They just learned you’re busy.',
        'Everyone learned you’re busy.'
      ],
      identity: [
        'Name one thing you love that has nothing to do with the business.',
        'Notice how long that took.',
        'That pause is the cost.'
      ]
    };
    // "Another year of X only gets more expensive." — echoes their chosen cost.
    var COST_STAKES = {
      health: '2am wake-ups',
      marriage: 'them falling asleep alone next to you',
      kids: '“one sec, buddy”',
      friendships: 'calls you don’t return',
      identity: 'disappearing into the business'
    };
    var VERDICTS = {
      High:     { l1: 'You’re not running a business.', l2: 'You’re being run by one.' },
      Moderate: { l1: 'You’ve built something real —', l2: 'and it’s quietly starting to own you.' },
      Low:      { l1: 'It’s working.', l2: 'But the warning signs are already here.' }
    };

    var params = new URLSearchParams(window.location.search);
    var q2 = params.get('q2'), q3 = params.get('q3'), q4 = params.get('q4'),
        q5 = params.get('q5'), q6 = params.get('q6');
    var name = (params.get('name') || '').trim().slice(0, 100);
    var email = (params.get('email') || '').trim().slice(0, 200);
    var fresh = params.get('fresh') === '1';
    var jumpToBook = params.get('book') === '1';
    var q4n = parseInt(q4, 10);

    if (!REVENUE[q2] || !HOURS_POINTS[q3] || !(q4n >= 1 && q4n <= 5) || !VAC_POINTS[q5] || !MIRROR.q6[q6]){
      window.location.replace(ASSESSMENT_URL);
      return;
    }

    var score = q4n + HOURS_POINTS[q3] + VAC_POINTS[q5];
    var severity = score >= 10 ? 'High' : score >= 6 ? 'Moderate' : 'Low';
    var qualified = q2 !== '0-5k';
    var booked = false;
    try { booked = sessionStorage.getItem('ryBooked.' + email) === '1'; } catch(e){}

    // canonical address bar: drop the one-time fresh flag so copied links are clean
    if ((fresh || jumpToBook) && window.history && history.replaceState){
      params.delete('fresh');
      params.delete('book');
      history.replaceState(null, '', window.location.pathname + '?' + params.toString());
    }

    /* ── severity dial (score 3–13 across a semicircle) ─────────────── */
    function dialSvg(){
      var frac = Math.min(Math.max((score - 3) / 10, 0.04), 1);
      var cx = 160, cy = 150, r = 120;
      var semi = Math.PI * r; // arc length
      var a = Math.PI * (1 - frac); // marker angle
      var mx = cx + r * Math.cos(a), my = cy - r * Math.sin(a);
      // tier boundary ticks at scores 6 and 10
      function tick(f){
        var t = Math.PI * (1 - f);
        var x1 = cx + (r - 7) * Math.cos(t), y1 = cy - (r - 7) * Math.sin(t);
        var x2 = cx + (r + 7) * Math.cos(t), y2 = cy - (r + 7) * Math.sin(t);
        return '<line class="tick" x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke-width="1"/>';
      }
      return '' +
      '<div class="dial" role="img" aria-label="Severity: ' + severity + '">' +
        '<svg viewBox="0 0 320 170" xmlns="http://www.w3.org/2000/svg">' +
          '<defs><linearGradient id="dialGrad" x1="0%" y1="0%" x2="100%" y2="0%">' +
            '<stop offset="0%" stop-color="#8C837A"/>' +
            '<stop offset="55%" stop-color="#C2A86C"/>' +
            '<stop offset="100%" stop-color="#E3C98B"/>' +
          '</linearGradient></defs>' +
          '<path class="arc-bg" d="M 40 150 A 120 120 0 0 1 280 150" fill="none" stroke-width="2"/>' +
          tick(0.3) + tick(0.7) +
          '<path class="arc-fill" id="dialFill" d="M 40 150 A 120 120 0 0 1 280 150" fill="none" stroke-width="3" stroke-linecap="round" ' +
            'stroke-dasharray="' + semi.toFixed(1) + '" stroke-dashoffset="' + semi.toFixed(1) + '"/>' +
          '<rect class="marker" id="dialMarker" x="-5" y="-5" width="10" height="10" opacity="0" ' +
            'transform="translate(' + mx.toFixed(1) + ',' + my.toFixed(1) + ') rotate(45)"/>' +
        '</svg>' +
        '<div class="dial-center">' +
          '<span class="dc-label">Severity</span>' +
          '<span class="dc-tier">' + severity + '</span>' +
        '</div>' +
        '<div class="dial-ends"><span>Runs itself</span><span>Runs you</span></div>' +
      '</div>';
    }
    function animateDial(){
      var fill = document.getElementById('dialFill');
      var marker = document.getElementById('dialMarker');
      if (!fill) return;
      var frac = Math.min(Math.max((score - 3) / 10, 0.04), 1);
      var semi = Math.PI * 120;
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce){
        fill.setAttribute('stroke-dashoffset', (semi * (1 - frac)).toFixed(1));
        marker.setAttribute('opacity', '1');
        return;
      }
      fill.style.transition = 'stroke-dashoffset 1.6s cubic-bezier(0.16, 1, 0.3, 1)';
      marker.style.transition = 'opacity .5s ease';
      setTimeout(function(){
        fill.style.strokeDashoffset = (semi * (1 - frac)).toFixed(1);
      }, 650);
      setTimeout(function(){ marker.setAttribute('opacity', '1'); }, 1900);
    }

    /* ── render ─────────────────────────────────────────────────────── */
    function mirrorSentence(){
      var s = 'You’re working <b>' + esc(MIRROR.q3[q3]) + '</b> hours a week. ' +
              'You told me that if you disappeared for two weeks, <b>' + esc(MIRROR.q4[q4]) + '</b>. ';
      if (q5 === 'cant-remember'){
        s += 'And the last time you took a real week off… <b>you genuinely can’t remember</b>.';
      } else {
        s += 'And the last time you took a real week off was <b>' + esc(MIRROR.q5[q5]) + '</b>.';
      }
      return s;
    }

    var firstName = name ? esc(name.split(' ')[0]) : '';
    var v = VERDICTS[severity];
    var html = '';

    /* Verdict hero */
    html += '<header class="verdict">' +
      '<div class="topbar"><img src="../assets/logo-light.svg" alt="Jason Moss"></div>' +
      '<div class="verdict-main"><div class="verdict-inner">' +
        '<p class="eyebrow">' + (firstName ? firstName + ', here’s' : 'Here’s') + ' your result</p>' +
        dialSvg() +
        '<h1><span class="l1">' + v.l1 + '</span><span class="l2">' + v.l2 + '</span></h1>' +
        '<p class="vsub">Here’s what your answers actually say.</p>' +
      '</div></div>' +
      '<button type="button" class="scrollcue" id="scrollCue" aria-label="See your full results"><span></span></button>' +
    '</header>';

    /* The mirror */
    html += '<section class="bg-forest hairline-b" id="mirror"><div class="wrap stack reveal">' +
      '<hr class="divider"><p class="eyebrow">The mirror</p>' +
      '<p class="mirror-quote">' + mirrorSentence() + '</p>' +
      '<p class="pull" style="margin-top:10px !important">That’s not a scheduling problem. It’s a structural one.</p>' +
      '</div></section>';

    /* Why this is happening */
    html += '<section class="bg-charcoal glow"><div class="wrap stack reveal">' +
      '<hr class="divider"><p class="eyebrow">Why this is happening</p>' +
      '<h2>Here’s what’s actually going on:</h2>' +
      '<ol class="reasons">' +
      '<li><b>You built it this way on purpose.</b><p>Being the one who did everything was your edge — faster, smarter, more trusted than anyone you could hire. And it’s exactly what’s trapping you now.</p></li>' +
      '<li><b>And part of you won’t let go.</b><p>If you feel most valuable when you’re most needed, stepping back feels like loss, not relief. That’s why delegating never stuck. It’s not a systems problem. It’s a letting-go problem.</p></li>' +
      '<li><b>So now you’re the ceiling.</b><p>You don’t have a bottleneck. You are it. And no hire or system fixes that — because it isn’t just structural. It’s personal.</p></li>' +
      '</ol></div></section>';

    /* The cost (with the compounding line folded in) */
    html += '<section class="bg-forest hairline-b"><div class="wrap stack reveal">' +
      '<hr class="divider"><p class="eyebrow">The cost</p>' +
      '<p class="open">And here’s what most people miss: this isn’t just costing you time.</p>' +
      '<p class="costline">It’s costing you <em>' + esc(MIRROR.q6[q6]) + '</em>.</p>' +
      '<div class="cost-beats">' +
        COST_BEATS[q6].map(function(b){ return '<p>' + esc(b) + '</p>'; }).join('') +
      '</div>' +
      '<p class="pull" style="color:rgba(233,226,211,.92)">And it compounds. The bigger the business gets, the bigger the cage — more revenue, more dependency, less of you.</p>' +
      '</div></section>';

    /* You're not alone — connection + authority BEFORE the ask (cold traffic) */
    html += '<section class="bg-charcoal glow hairline-b"><div class="wrap reveal">' +
      '<img class="jm-face" src="../assets/jason-face.jpg" alt="Jason Moss">' +
      '<div class="stack"><hr class="divider"><p class="eyebrow">You’re not alone</p>' +
      '<h2>I’ve been there.</h2>' +
      '<p>Early on in my journey, I built a six-figure coaching business and then hit this exact wall. The thing I’d built was running me, and no amount of hustle was fixing it. So I rebuilt it, from the inside out, and scaled past $500k / year as a result.</p>' +
      '<p>Since then I’ve helped <b>1,000+ entrepreneurs</b> navigate the journey of business growth without sacrificing themselves.</p>' +
      '<div class="testi">' +
        '<img src="../assets/meaghan.jpg" alt="Meaghan L.">' +
        '<div>' +
          '<p class="t-text">With Jason’s help, I went from working 80-hour weeks to 20–25 — and scaled past <b>$260K in sales</b>.</p>' +
          '<p class="t-who">Meaghan L. · Business Coach</p>' +
        '</div>' +
      '</div>' +
      '</div></div>' +
      '<div class="trustlogos reveal">' +
        '<span class="tl-label">As featured in</span>' +
        '<div class="tl-row">' +
          '<img src="../assets/logo-forbes-scotland.png" alt="Forbes">' +
          '<img src="../assets/logo-business-insider.png" alt="Business Insider">' +
          '<img src="../assets/logo-entrepreneur.png" alt="Entrepreneur">' +
        '</div>' +
        '<div class="tl-row tl-row2">' +
          '<img src="../assets/logo-fast-company-sa.png" alt="Fast Company">' +
          '<img src="../assets/logo-obo.png" alt="One Business Original">' +
        '</div>' +
      '</div></section>';

    /* The turn */
    if (qualified){
      html += '<section class="bg-pale"><div class="wrap stack reveal">' +
        '<hr class="divider"><p class="eyebrow" style="color:var(--mocha)">Your next step</p>' +
        '<h2>Here’s the good news: this is fixable.</h2>' +
        '<p>Not by working harder or hiring another person — but by changing both things at once: how the business runs, and how you run it.</p>' +
        '<p>But it’s hard to shift that pattern from the inside. That’s why I want to help.</p>' +
        '<div class="bookcard" id="bookcard"><span class="corner tl"></span><span class="corner br"></span>' +
          '<p>Let’s spend 20 minutes together — free, just us.</p>' +
          '<p>We’ll find the one thing most responsible for your business running you, and the first move to change it. No pitch. You’ll leave clearer than you came, whether we work together or not.</p>' +
          '<p class="stakes">Another year of ' + esc(COST_STAKES[q6]) + ' only gets more expensive.</p>' +
          '<button type="button" class="btn" id="bookBtn">Book my call<span class="arr">→</span></button>' +
          '<p class="booked-note" id="bookedNote">You’re booked. The calendar invite is in your inbox — come ready to look at the real thing.</p>' +
          '<p class="microcta">Free. 20 minutes. Directly with me.</p>' +
        '</div></div></section>';
    } else {
      html += '<section class="bg-pale"><div class="wrap stack reveal">' +
        '<hr class="divider"><p class="eyebrow" style="color:var(--mocha)">The honest next step</p>' +
        '<h2>Here’s the honest truth.</h2>' +
        '<p>The deepest version of this work is for people whose business is already generating real revenue — because the fix involves restructuring something that’s already substantial.</p>' +
        '<p>You’re earlier in the journey, and that’s exactly where I share the most. Everything I know about building a business that gives you freedom instead of trapping you — I put on YouTube.</p>' +
        '<p style="margin-top:34px"><a class="btn" href="' + YOUTUBE_URL + '" target="_blank" rel="noopener">Watch on YouTube<span class="arr">→</span></a></p>' +
        '</div></section>';
    }

    html += '<footer><img src="../assets/logo-light.svg" alt="Jason Moss">' +
      '<p>© Jason Moss LLC. All rights reserved</p>' +
      '<p><a href="/privacy/" target="_blank" rel="noopener">Privacy Policy</a> | <a href="/terms/" target="_blank" rel="noopener">Terms &amp; Conditions</a> | <a href="/earnings-disclaimer/" target="_blank" rel="noopener">Earnings Disclaimer</a></p>' +
      '<p>This website is not a part of Facebook or Meta Platforms, Inc.</p>' +
      '<p>Additionally, this site is NOT endorsed by Facebook in any way.</p>' +
      '<p>Facebook is a trademark of Meta Platforms, Inc.</p>' +
      '</footer>';

    /* Sticky book bar (qualified only) */
    if (qualified){
      html += '<div class="stickybar" id="stickybar">' +
        '<div class="t">Ready for it to stop running you? — <b>free 20 minutes, directly with me.</b></div>' +
        '<button type="button" class="btn" id="stickyBookBtn">Book my call<span class="arr">→</span></button>' +
      '</div>';
    }

    document.getElementById('results').innerHTML = html;
    animateDial();

    // email CTAs land right on the booking card (?book=1). Instant jump —
    // native smooth scrolling gets canceled in in-app browsers (Gmail etc.),
    // which is exactly where email clicks open.
    if (jumpToBook){
      setTimeout(function(){
        var card = document.getElementById('bookcard');
        if (!card) return;
        var vh = window.innerHeight || document.documentElement.clientHeight || 800;
        var r = card.getBoundingClientRect();
        window.scrollTo(0, Math.max(0, r.top + window.scrollY - Math.max((vh - r.height) / 2, 20)));
      }, 250);
    }

    /* scroll cue */
    var cue = document.getElementById('scrollCue');
    if (cue){
      cue.addEventListener('click', function(){
        var el = document.getElementById('mirror');
        if (el) el.scrollIntoView({ behavior:'smooth' });
      });
    }

    /* scroll reveals + sticky bar */
    var reveals = [].slice.call(document.querySelectorAll('.reveal'));
    var bar = document.getElementById('stickybar');
    var bookcard = document.getElementById('bookcard');
    function tick(){
      var vh = window.innerHeight || document.documentElement.clientHeight || 800;
      reveals = reveals.filter(function(el){
        if (el.getBoundingClientRect().top < vh * 0.88){ el.classList.add('in'); return false; }
        return true;
      });
      if (bar){
        var past = window.scrollY > vh * 0.9;
        var cardVisible = false;
        if (bookcard){
          var r = bookcard.getBoundingClientRect();
          cardVisible = r.top < vh && r.bottom > 0;
        }
        if (past && !cardVisible && !booked){ bar.classList.add('show'); }
        else { bar.classList.remove('show'); }
      }
    }
    window.addEventListener('scroll', tick, { passive:true });
    window.addEventListener('resize', tick, { passive:true });
    window.addEventListener('load', tick);
    tick();

    /* ── events ─────────────────────────────────────────────────────── */
    // fresh=1 marks arrival straight from the quiz submit; email revisits
    // (Kit link, bookmarks) fire results_viewed only, so Meta conversion
    // counts don't inflate on re-opens.
    if (fresh){
      track('assessment_complete', { assessment_severity: severity, assessment_qualified: qualified ? 'yes' : 'no' });
      // Lead + qualified_lead fire ONCE EVER per person (localStorage flag,
      // keyed by email) — retakes, revisits, and back-button replays never
      // re-fire the Meta optimization event.
      var leadKey = 'ryLeadFired.' + email;
      var leadAlreadyFired = false;
      try { leadAlreadyFired = localStorage.getItem(leadKey) === '1'; } catch(e){}
      if (qualified && !leadAlreadyFired && IS_LIVE){
        try { localStorage.setItem(leadKey, '1'); } catch(e){}
        track('qualified_lead', { assessment_severity: severity });
        // Meta standard Lead event, fired straight at the pixel (loaded by
        // GTM's base code) — qualified ($5k+/mo) completers only.
        (function fireMetaLead(tries){
          if (window.fbq){
            window.fbq('track', 'Lead', { content_name: 'runs-you-assessment', content_category: severity });
            return;
          }
          if ((tries || 0) < 40) setTimeout(function(){ fireMetaLead((tries || 0) + 1); }, 250);
        })(0);
      }
    }
    track('results_viewed', { assessment_severity: severity, assessment_qualified: qualified ? 'yes' : 'no' });

    /* ── Calendly ───────────────────────────────────────────────────── */
    var calendlyLoaded = false;
    function loadCalendly(){
      if (calendlyLoaded) return;
      calendlyLoaded = true;
      var css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = 'https://assets.calendly.com/assets/external/widget.css';
      document.head.appendChild(css);
      var s = document.createElement('script');
      s.src = 'https://assets.calendly.com/assets/external/widget.js';
      s.async = true;
      document.head.appendChild(s);
    }
    function openCalendly(){
      loadCalendly();
      if (!window.Calendly){
        var tries = 0;
        var t = setInterval(function(){
          tries += 1;
          if (window.Calendly){ clearInterval(t); openCalendly(); }
          else if (tries > 20){ clearInterval(t); window.open(CALENDLY_URL, '_blank'); }
        }, 250);
        return;
      }
      window.Calendly.initPopupWidget({
        url: CALENDLY_URL + '?hide_gdpr_banner=1&primary_color=2c3f36',
        prefill: { name: name || '', email: email || '' }
      });
    }
    function showBookedNote(){
      var note = document.getElementById('bookedNote');
      var btn = document.getElementById('bookBtn');
      if (note) note.classList.add('show');
      if (btn) btn.style.display = 'none';
      if (bar) bar.classList.remove('show');
    }

    var bookBtn = document.getElementById('bookBtn');
    var stickyBookBtn = document.getElementById('stickyBookBtn');
    if (bookBtn) bookBtn.addEventListener('click', openCalendly);
    if (stickyBookBtn) stickyBookBtn.addEventListener('click', openCalendly);
    if (qualified){
      loadCalendly();
      if (booked) showBookedNote();
    }

    window.addEventListener('message', function(e){
      if (e.origin.indexOf('calendly.com') === -1) return;
      var d = e.data;
      if (d && d.event === 'calendly.event_scheduled'){
        booked = true;
        try { sessionStorage.setItem('ryBooked.' + email, '1'); } catch(err){}
        track('call_booked', { assessment_severity: severity });
        showBookedNote();
        if (email){
          try {
            fetch(FN_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'booked', email: email }),
              keepalive: true
            });
          } catch(err){}
        }
      }
    });
  })();
  </script>
</body>
</html>
