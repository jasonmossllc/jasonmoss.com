<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="robots" content="noindex">

<style>
  :root{
    --obsidian:#1D1F1E;
    --obsidian-deep:#141615;
    --forest:#2C3F36;
    --mocha:#5B4B3F;
    --taupe:#8C837A;
    --gold:#C2A86C;
    --gold-dark:#b89a5e;
    --stone:#E9E2D3;
    --sand:#F8F6F2;
    --serif:'Libre Baskerville', Georgia, serif;
    --sans:'Raleway', 'Helvetica Neue', sans-serif;
    --ease:cubic-bezier(0.16, 1, 0.3, 1);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:var(--sans); color:var(--sand);
    background:var(--obsidian); -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    font-size:18px; line-height:1.75; font-weight:400;
  }
  img{ max-width:100%; display:block; }
  ::selection{ background:rgba(194,168,108,.35); color:var(--sand); }
  .bg-pale ::selection{ color:var(--obsidian); }
  .wrap{ max-width:820px; margin:0 auto; padding:0 28px; }

  /* ---------- type ---------- */
  h1,h2{ font-family:var(--serif); font-weight:400; margin:0; text-wrap:balance; }
  h1{ font-size:clamp(34px,4.4vw,52px); line-height:1.16; letter-spacing:-.02em; }
  h2{ font-size:clamp(27px,3.6vw,40px); line-height:1.22; letter-spacing:-.01em; }
  .eyebrow{
    font-size:11px; letter-spacing:.30em; text-transform:uppercase; font-weight:600;
    color:var(--gold); margin:0 0 20px;
  }
  .divider{ width:56px; height:1px; background:var(--gold); opacity:.55; border:0; margin:0 0 26px; }
  .stack p{ margin:0 0 22px; max-width:62ch; text-wrap:pretty; }
  .stack p.open{
    font-family:var(--serif); font-size:clamp(20px,2.4vw,24px); line-height:1.55;
    color:var(--sand); margin-bottom:26px;
  }
  .stack p:last-child{ margin-bottom:0; }
  .stack h2{ margin:0 0 34px; }
  .centered{ text-align:center; }
  .centered .divider{ margin-left:auto; margin-right:auto; }
  .centered > p, .centered h2{ margin-left:auto; margin-right:auto; }
  .centered .bookcard{ text-align:left; }
  .centered .bookcard p{ margin-left:0; margin-right:0; max-width:none; }
  .centered .bookcard .microcta{ text-align:center; }
  .layerhead{
    font-family:var(--serif); font-style:italic; font-size:clamp(20px,2.4vw,24px);
    color:var(--gold); margin:48px 0 20px; font-weight:400;
  }
  .layerhead.first{ margin-top:0; }
  .bg-pale .stack p{ color:#3a3c3b; }

  /* ---------- textured grounds ---------- */
  .bg-forest{
    background:
      linear-gradient(180deg, rgba(44,63,54,.84), rgba(31,45,39,.94)),
      url('../assets/section-bg-forest.jpg') center / cover no-repeat,
      var(--forest);
  }
  .bg-charcoal{
    background:
      linear-gradient(180deg, rgba(29,31,30,.88), rgba(20,22,21,.96)),
      url('../assets/section-bg-forest.jpg') center / cover no-repeat,
      var(--obsidian);
  }
  .bg-pale{
    background:
      linear-gradient(180deg, rgba(248,246,242,.90), rgba(248,246,242,.96)),
      url('../assets/section-bg-pale.jpg') center / cover no-repeat,
      var(--sand);
    color:var(--obsidian);
  }
  section{ padding:110px 0; position:relative; }
  .hairline-b{ border-bottom:1px solid rgba(194,168,108,.14); }
  .glow:before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 62% 42% at 50% 0%, rgba(194,168,108,.08) 0%, transparent 70%);
  }
  .glow > *{ position:relative; }

  /* ---------- buttons ---------- */
  .btn{
    display:inline-block; background:var(--gold); color:var(--obsidian);
    font-family:var(--sans); font-weight:600; font-size:15px; letter-spacing:.04em;
    padding:20px 46px; border:0; border-radius:0; text-decoration:none; cursor:pointer;
    transition:background .2s var(--ease), transform .2s var(--ease), box-shadow .2s var(--ease);
  }
  .btn .arr{ display:inline-block; transition:transform .25s var(--ease); margin-left:10px; }
  .btn:hover{
    background:var(--gold-dark); transform:translateY(-1px);
    box-shadow:0 16px 34px -14px rgba(194,168,108,.45);
  }
  .btn:hover .arr{ transform:translateX(4px); }
  .btn:focus-visible{ outline:2px solid var(--sand); outline-offset:3px; }
  .microcta{ font-size:13.5px; color:var(--taupe); margin:18px 0 0; letter-spacing:.05em; }

  /* ============ HERO ============ */
  .hero{
    position:relative; display:flex; flex-direction:column; overflow:hidden; text-align:center;
    background:
      linear-gradient(180deg, rgba(20,22,21,.82) 0%, rgba(24,28,26,.78) 45%, rgba(20,22,21,.94) 100%),
      url('../assets/section-bg-forest.jpg') center / cover no-repeat,
      url('../assets/forest-bg.jpg') center 30% / cover no-repeat,
      var(--obsidian-deep);
    background-blend-mode: normal, soft-light, normal;
  }
  .hero:before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(ellipse 70% 45% at 50% 8%, rgba(194,168,108,.13) 0%, transparent 70%),
      radial-gradient(ellipse 130% 90% at 50% 50%, transparent 58%, rgba(14,16,15,.5) 100%);
  }
  .hero:after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:140px; pointer-events:none;
    background:linear-gradient(180deg, transparent, var(--obsidian-deep));
  }
  .hero .topbar{
    position:relative; z-index:3; display:flex; justify-content:center; padding:34px 24px 0;
  }
  .hero .topbar img{ height:30px; width:auto; }
  .hero-main{
    position:relative; z-index:2; display:flex; align-items:center; justify-content:center;
    padding:60px 28px 110px;
  }
  .hero-inner{ max-width:660px; width:100%; }
  .hero .eyebrow{ margin-bottom:30px; }
  .hero-lead{
    font-family:var(--serif); font-size:clamp(21px,2.8vw,28px); line-height:1.55;
    color:var(--sand); margin:0 auto; max-width:24em; text-wrap:balance;
    text-shadow:0 2px 44px rgba(0,0,0,.4);
  }
  .hero-sub{ font-family:var(--sans); font-size:16.5px; line-height:1.75; color:rgba(248,246,242,.82); max-width:640px; margin:0 auto 18px; }
  .hero-lead em{ font-style:italic; color:var(--gold); }

  /* ============ CHAIN VISUAL — words first ============ */
  .chain{
    margin:52px auto 0; max-width:560px; text-align:left;
    border-top:1px solid rgba(233,226,211,.10);
  }
  .crow{ padding:19px 16px 21px; border-bottom:1px solid rgba(233,226,211,.10); }
  .crow-top{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .c-name{
    font-size:14px; letter-spacing:.16em; text-transform:uppercase; font-weight:600;
    color:rgba(233,226,211,.9);
  }
  .c-badge{
    font-size:9px; letter-spacing:.22em; text-transform:uppercase; font-weight:600;
    color:var(--obsidian); background:var(--gold); padding:4px 9px 3px;
    white-space:nowrap;
  }
  .c-status{
    margin-left:auto; font-family:var(--serif); font-style:italic;
    font-size:17px; color:rgba(233,226,211,.88); white-space:nowrap;
  }
  .crow-sub{ display:flex; align-items:center; gap:14px; margin-top:5px; }
  .c-desc{ font-size:13.5px; font-weight:300; color:var(--taupe); line-height:1.5; }
  .c-bar{ margin-left:auto; display:flex; gap:4px; flex:none; }
  .seg{ width:22px; height:6px; background:rgba(233,226,211,.13); }
  .seg.fill{ background:rgba(233,226,211,.55); }
  .crow.gold{
    background:rgba(194,168,108,.07); border-left:2px solid var(--gold);
    border-bottom-color:rgba(194,168,108,.35); padding:24px 16px 26px;
  }
  .crow.gold .c-name{
    font-family:var(--serif); text-transform:none; letter-spacing:0;
    font-size:22px; color:var(--gold);
  }
  .crow.gold .c-status{ color:var(--gold); font-size:19px; }
  .crow.gold .seg{ background:transparent; box-shadow:inset 0 0 0 1px rgba(194,168,108,.4); }
  .crow.gold .seg.fill{
    background:var(--gold); box-shadow:0 0 12px rgba(194,168,108,.5);
  }
  .crow.muted{ opacity:.5; }
  .crow.muted .c-name{ color:var(--taupe); }
  .crow.muted .c-status{ font-size:14.5px; }
  .chain-cap{
    font-size:14px; font-weight:300; line-height:1.75; color:rgba(233,226,211,.62);
    max-width:480px; margin:30px auto 0;
  }
  @media (prefers-reduced-motion:no-preference){
    html.js .seg.fill{ transform:scaleX(0); transform-origin:left; }
    html.js .chain.on .seg.fill{ transform:none; transition:transform .9s var(--ease); }
  }

  /* scroll cue */
  .scrollcue{
    position:absolute; left:0; right:0; bottom:30px; margin:0 auto; width:max-content; z-index:3;
    background:none; border:0; cursor:pointer; padding:10px;
  }
  .scrollcue span{
    display:block; width:14px; height:14px;
    border-left:1px solid rgba(194,168,108,.8); border-bottom:1px solid rgba(194,168,108,.8);
    transform:rotate(-45deg);
  }
  @media (prefers-reduced-motion:no-preference){
    .scrollcue span{ animation:cue 2.2s ease-in-out infinite; }
    @keyframes cue{ 0%,100%{ transform:rotate(-45deg) translate(0,0); opacity:.85; } 50%{ transform:rotate(-45deg) translate(-5px,5px); opacity:.35; } }
  }

  /* hero entrance + scroll reveals */
  @media (prefers-reduced-motion:no-preference){
    .hero .topbar, .hero .eyebrow, .hero-lead, .chain, .chain-cap, .scrollcue{
      opacity:0; transform:translateY(18px);
      animation:rise 1s var(--ease) forwards;
    }
    .hero .topbar{ animation-delay:.05s; }
    .hero .eyebrow{ animation-delay:.2s; }
    .hero-lead{ animation-delay:.35s; }
    .chain{ animation-delay:.55s; }
    .chain-cap{ animation-delay:.85s; }
    .scrollcue{ animation-delay:1.1s; }
    @keyframes rise{ to{ opacity:1; transform:none; } }
    html.js .reveal{ opacity:0; transform:translateY(22px); transition:opacity .9s var(--ease), transform .9s var(--ease); }
    html.js .reveal.in{ opacity:1; transform:none; }
  }

  /* ============ VERDICT ============ */
  .verdict h1 .l1{ display:block; color:var(--sand); }
  .verdict h1 .l2{ display:block; font-style:italic; color:var(--gold); margin-top:10px; }
  .verdict h1{ margin-bottom:40px; }
  .vlines p.open{ margin-bottom:24px; }
  .aside{
    margin:44px 0 0; padding:24px 28px; max-width:640px;
    border-left:1px solid rgba(194,168,108,.5); background:rgba(20,22,21,.28);
  }
  .aside p{ margin:0; font-size:16px; line-height:1.75; color:rgba(233,226,211,.88); max-width:none; }
  .aside p b{ color:var(--gold); font-weight:400; }
  .aside.quiet{ border-left-color:rgba(140,131,122,.5); margin-top:20px; }
  .aside.quiet p{ font-size:14.5px; color:rgba(233,226,211,.66); }
  .aside.quiet p b{ color:rgba(233,226,211,.8); }

  /* ============ BOOK CARD ============ */
  .bookcard{
    position:relative; background:#fff; margin:54px auto 0; padding:52px 44px 44px;
    border:1px solid rgba(140,131,122,.25);
    box-shadow:
      0 2px 8px -2px rgba(29,31,30,.12),
      0 18px 50px -18px rgba(194,168,108,.28),
      0 44px 90px -40px rgba(29,31,30,.55);
    max-width:660px;
  }
  .bookcard:before{
    content:""; position:absolute; top:-7px; left:50%; width:13px; height:13px;
    background:var(--gold); transform:translateX(-50%) rotate(45deg);
    box-shadow:0 0 0 5px #fff;
  }
  .bookcard .corner{ position:absolute; width:46px; height:46px; pointer-events:none; }
  .bookcard .corner.tl{ top:-1px; left:-1px; border-top:2px solid var(--gold); border-left:2px solid var(--gold); }
  .bookcard .corner.br{ bottom:-1px; right:-1px; border-bottom:2px solid var(--gold); border-right:2px solid var(--gold); }
  .bookcard .btn{ display:block; width:100%; text-align:center; }
  .bookcard p{ color:#3a3c3b; margin:0 0 18px; }
  .bookcard p:first-of-type{ font-family:var(--serif); font-size:22px; color:var(--obsidian); }
  .bookcard .btn{ padding:22px 54px; font-size:16px; }
  .bookcard .microcta{ color:var(--taupe); margin-top:14px; text-align:center; }
  .booked-note{ display:none; font-family:var(--serif); font-size:19px; color:var(--forest); margin:8px 0 0; }
  .booked-note.show{ display:block; }

  footer{
    text-align:center; padding:54px 24px 120px; background:var(--obsidian-deep);
    border-top:1px solid rgba(194,168,108,.14);
  }
  footer img{ height:26px; margin:0 auto 16px; opacity:.85; }
  footer .gratitude{
    color:rgba(140,131,122,.75); font-size:12px; font-weight:300; line-height:1.7;
    max-width:520px; margin:0 auto 26px; letter-spacing:.02em;
  }
  footer p{ color:rgba(140,131,122,.5); font-size:10.5px; margin:0 0 6px; letter-spacing:.05em; }
  footer p:last-child{ margin-bottom:0; }
  footer a{ color:rgba(140,131,122,.6); text-decoration:underline; text-underline-offset:3px; }
  footer a:hover{ color:var(--gold); }

  /* ============ STICKY BOOK BAR ============ */
  .stickybar{
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    background:rgba(37,54,46,.92);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border-top:1px solid rgba(194,168,108,.35);
    display:flex; align-items:center; justify-content:center; gap:26px; flex-wrap:wrap;
    padding:13px 22px; transform:translateY(115%); transition:transform .35s var(--ease);
  }
  .stickybar.show{ transform:none; }
  .stickybar .t{ font-family:var(--serif); font-size:15px; color:var(--sand); }
  .stickybar .t b{ color:var(--gold); font-weight:400; font-style:italic; }
  .stickybar .btn{ padding:14px 30px; font-size:13.5px; }

  /* ============ EMPTY STATE ============ */
  .empty{
    min-height:100vh; min-height:100svh; justify-content:flex-start;
  }
  .empty .hero-main{ flex:1; align-items:center; padding-bottom:80px; }
  .empty h1{ margin:0 0 26px; }
  .empty p{
    font-size:17px; font-weight:300; line-height:1.8; color:rgba(233,226,211,.72);
    max-width:460px; margin:0 auto 40px;
  }

  /* ============ MOBILE ============ */
  @media (max-width:780px){
    section{ padding:78px 0; }
    .hero-main{ padding:40px 24px 90px; }
    .stickybar .t{ display:none; }
    .btn{ white-space:nowrap; padding:18px 26px; font-size:14px; }
    .aside{ padding:20px 22px; }
    .crow-top{ gap:9px; }
    .c-badge{ letter-spacing:.16em; padding:3px 7px 2px; }
    .crow.gold .c-name{ font-size:18px; }
  }

  /* ============ PRINT ============ */
  @media print{
    body{ background:#fff; color:#1D1F1E; }
    .stickybar, .scrollcue{ display:none !important; }
    .seg, .crow.gold .seg.fill{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }

  .hero-result{ font-family:var(--serif); font-weight:400; font-size:clamp(40px,7vw,72px); line-height:1.12; letter-spacing:-.02em; margin:10px 0 18px; }
  .hero-result b{ color:var(--gold); font-weight:400; }
  .hero-hint{ font-size:15px; color:rgba(248,246,242,.55); margin-top:26px; }




  .c-num{ font-family:var(--serif); font-style:italic; color:rgba(194,168,108,.75); margin-right:12px; font-size:16px; }

</style>

<body>
  <script>document.documentElement.classList.add('js');</script>
  <main id="results"></main>

  <script>
  (function(){
    'use strict';

    var FN_URL = '/.netlify/functions/submit-bottleneck';
    var CALENDLY_URL = 'https://calendly.com/jasonmoss/business-assessment-call-with-jason-moss';
    var ASSESSMENT_URL = '/growth-bottleneck/';
    var STORE_KEY = 'gba_v1';

    window.dataLayer = window.dataLayer || [];
    // Analytics only on the live domain — localhost / deploy previews stay
    // out of the funnel data.
    var IS_LIVE = location.hostname === 'jasonmoss.com';
    function gtag(){ window.dataLayer.push(arguments); }
    if (IS_LIVE){
      gtag('js', new Date());
      // direct GA4 hookup — GTM keeps owning page_view, we send funnel events
      gtag('config', 'G-P5D1GH2M97', { send_page_view: false });
    }
    function track(eventName, extra){
      var payload = { event: eventName };
      if (extra) for (var k in extra) payload[k] = extra[k];
      window.dataLayer.push(payload);   // GTM-style (Meta/GTM triggers)
      if (IS_LIVE) gtag('event', eventName, extra || {});  // straight to GA4
    }
    // Every param-derived string that touches markup goes through esc() —
    // stage keys / scores / bands are additionally whitelist-validated below,
    // so nothing user-controlled ever reaches innerHTML unescaped.
    function esc(s){
      return String(s).replace(/[&<>"']/g, function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      });
    }

    /* ── the five stages, chain order ───────────────────────────────── */
    var ORDER = ['reach','nurture','enroll','deliver','deepen'];
    var STAGE_KEYS = {
      r:'reach', n:'nurture', e:'enroll', d:'deliver', p:'deepen',
      reach:'reach', nurture:'nurture', enroll:'enroll', deliver:'deliver', deepen:'deepen'
    };
    var LABELS = { reach:'Reach', nurture:'Nurture', enroll:'Enroll', deliver:'Deliver', deepen:'Deepen' };
    var DESCS = {
      reach:'New people discover you',
      nurture:'Strangers become people who trust you',
      enroll:'Interested people become paying clients',
      deliver:'Clients get the result you promised',
      deepen:'Clients stay, go further, and send others'
    };
    var NY_NOTES = {
      nurture:'<b>Nurture</b> isn’t scored yet — you don’t have a list or a place where people hear from you yet. That’s not a failure. Your business just isn’t at that stage yet.',
      deliver:'<b>Deliver</b> isn’t scored yet — you haven’t had paying clients yet. That’s not a failure. Your business just isn’t at that stage yet.',
      deepen:'<b>Deepen</b> isn’t scored yet — you haven’t had a client finish working with you yet. That’s not a failure. Your business just isn’t at that stage yet.'
    };
    var REV = { '0-5k':1, '5-10k':1, '10-25k':1, '25-50k':1, '50k-plus':1 };

    /* ── read + validate params (URL first, localStorage fallback) ──── */
    function parseState(search){
      var p = new URLSearchParams(search);
      var sRaw = (p.get('s') || '').split(',');
      if (sRaw.length !== 5) return null;
      var scores = [];
      for (var i = 0; i < 5; i++){
        var n = parseInt(sRaw[i], 10);
        if (!(n >= 0 && n <= 3) || String(n) !== sRaw[i].trim()) return null;
        scores.push(n);
      }
      var ny = {};
      (p.get('ny') || '').split(',').forEach(function(tok){
        var key = STAGE_KEYS[tok.trim().split(':')[0]];
        if (key) ny[key] = true;
      });
      var rev = p.get('rev') || '';
      if (rev && !REV[rev]) rev = '';
      var b = STAGE_KEYS[(p.get('b') || '').trim()] || '';
      var cParam = p.get('c');
      var c = STAGE_KEYS[(cParam || '').trim()] || '';
      // a stage the instrument excluded can never carry the verdict
      if (b && ny[b]) b = '';
      if (!b){
        var routed = route(scores, ny, rev);
        b = routed.primary;
        c = routed.second;               // computed set: compute both
      }
      if (c && (c === b || ny[c])) c = '';
      return {
        scores: scores, ny: ny, rev: rev, b: b, c: c,
        name: (p.get('name') || '').trim().slice(0, 100),
        email: (p.get('email') || '').trim().slice(0, 200),
        fresh: p.get('fresh') === '1',
        book: p.get('book') === '1'
      };
    }

    /* client mirror of the server routing — fallback only */
    function route(scores, ny, rev){
      function sc(k){ return scores[ORDER.indexOf(k)]; }
      var displayed = ORDER.filter(function(k){ return !ny[k]; });
      var pool;
      if (rev === '0-5k'){
        var front = ['reach','nurture','enroll'].filter(function(k){ return !ny[k]; });
        var back = ['deliver','deepen'].filter(function(k){ return !ny[k]; });
        var qual = back.filter(function(bk){
          return front.every(function(f){ return sc(bk) < sc(f); });
        });
        if (qual.length){
          qual.sort(function(a, b){ return sc(a) - sc(b) || ORDER.indexOf(a) - ORDER.indexOf(b); });
          pool = [qual[0]];
        } else {
          pool = front;
        }
      } else {
        pool = displayed;
      }
      var primary = pool.reduce(function(best, k){
        return (best === '' || sc(k) < sc(best)) ? k : best;
      }, '');
      var second = '';
      displayed.forEach(function(k){
        if (k === primary) return;
        if (sc(k) > sc(primary) + 1) return;

        '<p class="eyebrow">' + (firstName ? firstName + ', here’s' : 'Here’s') + ' your result</p>' +
        '<p class="hero-lead">Every client goes through five stages with you — from stranger to paying client.</p>' +
        '<p class="hero-sub">When all five work, growth gets a lot easier. When one breaks, growth stops.</p>' +
        '<p class="hero-sub" style="color:var(--gold)"><em>Here’s yours — ' + introTail + '.</em></p>' +
        chainHtml() +
        '<p class="chain-cap">' + capLead + ' You don’t have five problems. You have one — and fixing it frees up everything after it.</p>' +
      '</div></div>' +
      '<button type="button" class="scrollcue" id="scrollCue" aria-label="Read your verdict"><span></span></button>' +
    '</header>';

    /* verdict */
    html += '<section class="bg-forest hairline-b verdict" id="verdict"><div class="wrap stack reveal">' +
      '<hr class="divider"><p class="eyebrow">Your bottleneck — ' + LABELS[b] + '</p>' +
      '<h1><span class="l1">' + H.l1 + '</span>' + (H.l2 ? '<span class="l2">' + H.l2 + '</span>' : '') + '</h1>' +
      '<div class="vlines">' + paras(VERDICT_LINES[b], true) + '</div>';


    ORDER.forEach(function(k){
      if (ny[k] && NY_NOTES[k]){
        html += '<div class="aside quiet"><p>' + NY_NOTES[k] + '</p></div>';
      }
    });
    html += '</div></section>';

    /* the stage — what it is and why it matters */
    html += '<section class="bg-charcoal glow hairline-b"><div class="wrap stack reveal">' +
      '<hr class="divider"><p class="eyebrow">The stage</p>' +
      '<h2>What ' + LABELS[b].toLowerCase() + ' is — and why it matters.</h2>' +
      paras(block.what) +
      '</div></section>';

    /* the cost */
    html += '<section class="bg-forest hairline-b"><div class="wrap stack reveal">' +
      '<hr class="divider"><p class="eyebrow">The cost</p>' +
      '<h2>What this is costing you.</h2>' +
      paras(block.cost) +
      '</div></section>';

    /* the payoff */
    html += '<section class="bg-charcoal glow hairline-b"><div class="wrap stack reveal">' +
      '<hr class="divider"><p class="eyebrow">The payoff</p>' +
      '<h2>What changes when you fix it.</h2>' +
      paras(block.payoff) +
      '</div></section>';

    /* the two layers */
    html += '<section class="bg-forest hairline-b"><div class="wrap stack reveal">' +
      '<hr class="divider"><p class="eyebrow">The two layers</p>' +
      '<h2>What’s actually going on.</h2>' +
      '<p class="layerhead first">On the outside</p>' +
      paras(block.outside) +
      '<p class="layerhead">On the inside</p>' +
      paras(block.inside) +
      '</div></section>';

    /* next step — bridge + booking card */
    html += '<section class="bg-pale"><div class="wrap stack centered reveal">' +
      '<hr class="divider"><p class="eyebrow" style="color:var(--mocha)">Your next step</p>' +
      paras(block.bridge, true) +
      '<div class="bookcard" id="bookcard"><span class="corner tl"></span><span class="corner br"></span>' +
        '<p>Let’s look at this together.</p>' +
        '<p>A result like this is useful. A conversation about it is more useful.</p>' +
        '<p>If you want a second set of eyes, I’d be glad to offer you a free 15-minute session — you and me, one on one. We’ll look at what’s actually going on in your business and map out exactly what needs to change.</p>' +
        '<p>It’s fifteen minutes looking at your business together. If it’s clear I can help beyond that, I’ll say so. If not, you’ll still leave with a clearer picture.</p>' +
        '<button type="button" class="btn" id="bookBtn">Book your free 15-minute session<span class="arr">→</span></button>' +
        '<p class="booked-note" id="bookedNote">You’re booked. The calendar invite is in your inbox — see you there.</p>' +
        '<p class="microcta">No preparation needed. Bring your business as it is — not as you think it should be.</p>' +
      '</div></div></section>';

    /* footer */
    html += '<footer><img src="../assets/logo-light.svg" alt="Jason Moss">' +
      '<p class="gratitude">This assessment builds on client-journey ideas taught across the coaching world — with particular gratitude to Shoshanna Raven, whose teaching helped shape the earliest version of this lens.</p>' +
      '<p>© Jason Moss LLC. All rights reserved</p>' +
      '<p><a href="/privacy/" target="_blank" rel="noopener">Privacy Policy</a> | <a href="/terms/" target="_blank" rel="noopener">Terms &amp; Conditions</a> | <a href="/earnings-disclaimer/" target="_blank" rel="noopener">Earnings Disclaimer</a></p>' +
      '<p>This website is not a part of Facebook or Meta Platforms, Inc.</p>' +
      '<p>Additionally, this site is NOT endorsed by Facebook in any way.</p>' +
      '<p>Facebook is a trademark of Meta Platforms, Inc.</p>' +
      '</footer>';

    /* sticky book bar — same single CTA, kept in reach */
    html += '<div class="stickybar" id="stickybar">' +
      '<div class="t">Want to look at this together? — <b>free 15 minutes, directly with me.</b></div>' +
      '<button type="button" class="btn" id="stickyBookBtn">Book your session<span class="arr">→</span></button>' +
    '</div>';

    root.innerHTML = html;

    /* chain bar animation */
    (function(){
      var chain = document.getElementById('chain');
      if (!chain) return;
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce){ chain.classList.add('on'); return; }
      setTimeout(function(){ chain.classList.add('on'); }, 750);
    })();

    // email CTAs land right on the booking card (?book=1). Instant jump —
    // native smooth scrolling gets canceled in in-app browsers (Gmail etc.),
    // which is exactly where email clicks open.
    if (state.book){
      setTimeout(function(){
        var card = document.getElementById('bookcard');
        if (!card) return;
        var vh = window.innerHeight || document.documentElement.clientHeight || 800;
        var r = card.getBoundingClientRect();
        window.scrollTo(0, Math.max(0, r.top + window.scrollY - Math.max((vh - r.height) / 2, 20)));
      }, 250);
    }

    /* scroll cue */
    var cue = document.getElementById('scrollCue');
    if (cue){
      cue.addEventListener('click', function(){
        var el = document.getElementById('verdict');
        if (el) el.scrollIntoView({ behavior:'smooth' });
      });
    }

    /* scroll reveals + sticky bar */
    var reveals = [].slice.call(document.querySelectorAll('.reveal'));
    var bar = document.getElementById('stickybar');
    var bookcard = document.getElementById('bookcard');
    function tick(){
      var vh = window.innerHeight || document.documentElement.clientHeight || 800;
      reveals = reveals.filter(function(el){
        if (el.getBoundingClientRect().top < vh * 0.88){ el.classList.add('in'); return false; }
        return true;
      });
      if (bar){
        var past = window.scrollY > vh * 0.9;
        var cardVisible = false;
        if (bookcard){
          var r = bookcard.getBoundingClientRect();
          cardVisible = r.top < vh && r.bottom > 0;
        }
        if (past && !cardVisible && !booked){ bar.classList.add('show'); }
        else { bar.classList.remove('show'); }
      }
    }
    window.addEventListener('scroll', tick, { passive:true });
    window.addEventListener('resize', tick, { passive:true });
    window.addEventListener('load', tick);
    tick();

    /* ── events ─────────────────────────────────────────────────────── */
    // fresh=1 marks arrival straight from the quiz submit; email revisits
    // (Kit link, bookmarks) fire results_viewed only. qualified_lead fires
    // on the quiz page at submit — never here.
    if (state.fresh){
      track('bottleneck_complete', { bottleneck: b, revenue_band: rev || '' });
    }
    track('results_viewed', { bottleneck: b, revenue_band: rev || '' });

    /* ── Calendly (same-page popup per ruling — no new tab) ─────────── */
    var calendlyLoaded = false;
    function loadCalendly(){
      if (calendlyLoaded) return;
      calendlyLoaded = true;
      var css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = 'https://assets.calendly.com/assets/external/widget.css';
      document.head.appendChild(css);
      var s = document.createElement('script');
      s.src = 'https://assets.calendly.com/assets/external/widget.js';
      s.async = true;
      document.head.appendChild(s);
    }
    function openCalendly(){
      loadCalendly();
      if (!window.Calendly){
        var tries = 0;
        var t = setInterval(function(){
          tries += 1;
          if (window.Calendly){ clearInterval(t); openCalendly(); }
          else if (tries > 20){ clearInterval(t); window.open(CALENDLY_URL, '_blank'); }
        }, 250);
        return;
      }
      window.Calendly.initPopupWidget({
        url: CALENDLY_URL + '?hide_gdpr_banner=1&primary_color=2c3f36&utm_source=gba&utm_medium=results&utm_content=' + b,
        prefill: { name: name || '', email: email || '' }
      });
    }
    function showBookedNote(){
      var note = document.getElementById('bookedNote');
      var btn = document.getElementById('bookBtn');
      if (note) note.classList.add('show');
      if (btn) btn.style.display = 'none';
      if (bar) bar.classList.remove('show');
    }

    var bookBtn = document.getElementById('bookBtn');
    var stickyBookBtn = document.getElementById('stickyBookBtn');
    if (bookBtn) bookBtn.addEventListener('click', openCalendly);
    if (stickyBookBtn) stickyBookBtn.addEventListener('click', openCalendly);
    loadCalendly();
    if (booked) showBookedNote();

    window.addEventListener('message', function(e){
      if (e.origin.indexOf('calendly.com') === -1) return;
      var d = e.data;
      if (d && d.event === 'calendly.event_scheduled'){
        booked = true;
        try { sessionStorage.setItem('gbaBooked.' + email, '1'); } catch(err){}
        track('call_booked', { bottleneck: b });
        showBookedNote();
        if (email){
          try {
            fetch(FN_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'booked', email: email }),
              keepalive: true
            });
          } catch(err){}
        }
      }
    });
  })();
  </script>
</body>
</html>
