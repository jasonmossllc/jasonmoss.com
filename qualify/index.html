<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Book a Business Assessment Call — Jason Moss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Raleway:wght@400;500;600&display=swap">
<style>
  :root{
    --obsidian:#1D1F1E;
    --forest:#2C3F36;
    --forest-deep:#22322A;
    --mocha:#4A3D33;      /* was #5B4B3F (4.6:1) -> 7.4:1 on sand */
    --taupe:#6B635B;      /* was #8C837A (3.1:1, failed AA) -> 5.5:1 on sand */
    --gold:#C2A86C;       /* decorative only: progress bar */
    --gold-deep:#8A6E28;  /* gold that is legible as text: 4.8:1 on sand */
    --sand:#F8F6F2;
    --line:rgba(29,31,30,.22);
    --line-soft:rgba(29,31,30,.10);
    --serif:'Libre Baskerville', Georgia, serif;
    --sans:'Raleway','Helvetica Neue',Arial,sans-serif;
    --ease:cubic-bezier(0.16,1,0.3,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--sand);
    color:var(--obsidian);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
  }

  /* Standalone: fill the window. Framed: the parent sizes the iframe to our
     content, so a 100vh floor would make every measurement taller than the
     frame we are already in and the embed would grow without bound. */
  .shell{
    max-width:600px;margin:0 auto;
    padding:32px 24px 48px;
    min-height:100vh;
    display:flex;flex-direction:column;
  }
  html.framed .shell{min-height:0}
  @media (max-width:600px){ .shell{padding:20px 18px 36px} }

  .bar{height:3px;background:var(--line-soft);border-radius:3px;overflow:hidden;flex:none}
  .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s var(--ease)}
  .bar.hide{visibility:hidden}
  .steplabel{
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);
    margin:10px 0 0;min-height:15px;font-weight:600;
  }

  /* Top-aligned so the question never changes position between steps. */
  .stage{padding:32px 0 0}
  @media (max-width:600px){ .stage{padding:24px 0 0} }
  .screen{animation:rise .4s var(--ease) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .screen{animation:none}
    .bar i{transition:none}
  }

  h1{
    font-family:var(--serif);font-weight:400;
    font-size:clamp(22px,5vw,29px);line-height:1.32;
    margin:0 0 10px;letter-spacing:-.01em;text-wrap:balance;
  }
  .sub{color:var(--mocha);font-size:15px;line-height:1.55;margin:0 0 24px;text-wrap:pretty}
  .eyebrow{
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--gold-deep);font-weight:600;margin:0 0 10px;
  }

  .opts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
  .opt{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:14px 16px;min-height:56px;
    font-family:var(--sans);font-size:16px;line-height:1.35;color:var(--obsidian);
    cursor:pointer;transition:border-color .15s,box-shadow .15s;
  }
  .opt:hover{border-color:var(--forest);box-shadow:0 2px 10px -4px rgba(29,31,30,.25)}
  .opt.on{border-color:var(--forest);box-shadow:inset 0 0 0 1px var(--forest)}
  .opt .k{
    flex:none;width:26px;height:26px;border-radius:6px;
    border:1px solid var(--line);display:grid;place-items:center;
    font-size:11px;color:var(--taupe);font-weight:600;
    transition:background .15s,color .15s,border-color .15s;
  }
  .opt:hover .k,.opt.on .k{background:var(--forest);border-color:var(--forest);color:#fff}

  .field{margin:0 0 18px}
  label.f{
    display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--taupe);margin:0 0 6px;font-weight:600;
  }
  input[type=text],input[type=email],textarea{
    width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:14px 16px;font-family:var(--sans);font-size:16px;color:var(--obsidian);
    transition:border-color .15s,box-shadow .15s;
  }
  textarea{min-height:112px;resize:vertical;line-height:1.55}
  input:focus,textarea:focus{
    outline:none;border-color:var(--forest);box-shadow:inset 0 0 0 1px var(--forest);
  }

  .opt:focus-visible,.btn:focus-visible,.back:focus-visible,.skip:focus-visible,
  a:focus-visible,input:focus-visible,textarea:focus-visible{
    outline:3px solid var(--forest);outline-offset:2px;
  }

  .btn{
    display:inline-flex;align-items:center;justify-content:center;
    background:var(--forest);color:#fff;border:none;border-radius:999px;
    padding:0 32px;min-height:52px;
    font-family:var(--sans);font-size:16px;font-weight:600;
    cursor:pointer;transition:background .18s;text-decoration:none;
  }
  .btn:hover{background:var(--forest-deep)}
  .btn:disabled{opacity:.6;cursor:default}
  .actions{display:flex;align-items:center;gap:16px;margin-top:20px;flex-wrap:wrap}
  @media (max-width:600px){
    .actions{gap:10px}
    .actions .btn{width:100%;order:-1}
  }
  .back,.skip{
    background:none;border:none;color:var(--taupe);
    font-family:var(--sans);font-size:14px;cursor:pointer;
    padding:10px 4px;min-height:44px;
  }
  .back:hover,.skip:hover{color:var(--obsidian)}
  .skip{text-decoration:underline;text-underline-offset:3px}

  .hint{font-size:13px;color:var(--taupe);margin:16px 0 0;line-height:1.5}
  .err{color:#8C3D26;font-size:14px;margin:0;font-weight:500}
  .err:empty{display:none}
  .err a{color:#8C3D26}

  /* The bot check belongs in the form, above the action — never orphaned.
     It must NOT be display:none while Turnstile renders into it: the widget
     sizes itself from its container's width, and a display:none container is
     zero-wide, so it renders too wide and gets cut off. visibility:hidden
     keeps the box in layout at full width while staying invisible. */
  .ts-slot{width:100%;visibility:hidden;height:0;overflow:hidden;margin:0}
  .ts-slot.show{visibility:visible;height:auto;overflow:visible;margin:4px 0 0}
  .ts-slot iframe{max-width:100%}

  /* The qualifying moment. Generic praise reads automated, so the copy names
     what they actually answered; this gives it the visual weight to match. */
  /* Booking screen, two zones. The fit panel is the moment — small, warm, gold
     — and then it stops. The instruction below it is the largest thing on the
     screen, because picking a time is the only thing left to do. A hairline
     closes the zone and hands off to the calendar. */
  .fit{
    position:relative;overflow:hidden;
    background:linear-gradient(158deg,#FFFFFF 0%,#FCFAF6 55%,#F7F3EA 100%);
    border:1px solid var(--line-soft);border-radius:12px;
    padding:22px 24px;margin:0 0 32px;
    box-shadow:0 1px 2px rgba(29,31,30,.04),0 16px 34px -26px rgba(29,31,30,.45);
  }
  .fit::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--gold) 0%,rgba(190,158,96,.22) 100%);
  }
  @media (max-width:600px){ .fit{padding:20px} }
  .fit-badge{
    display:inline-flex;align-items:center;gap:7px;
    background:var(--forest);color:#fff;border-radius:999px;
    padding:5px 13px 5px 10px;margin:0 0 12px;
    font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  }
  .fit-badge span{font-size:12px;line-height:1}
  .fit p.fit-line{
    margin:0 0 9px;font-family:var(--serif);color:var(--obsidian);
    font-size:clamp(19px,4.4vw,23px);line-height:1.3;
  }
  .fit p.fit-benefit{
    margin:0;color:var(--mocha);font-size:15px;line-height:1.55;text-wrap:pretty;
  }
  .next-step{
    display:flex;align-items:center;gap:10px;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--taupe);font-weight:600;margin:0 0 10px;
  }
  .next-step::before{
    content:"";width:22px;height:2px;flex:none;border-radius:2px;background:var(--gold);
  }
  .book-h{
    font-family:var(--serif);font-weight:400;color:var(--obsidian);
    font-size:clamp(28px,6.6vw,38px);line-height:1.16;margin:0 0 10px;
    letter-spacing:-.01em;
  }
  /* The one thing worth saying here is who is on the other side of it. */
  .book-sub{color:var(--mocha);font-size:15.5px;line-height:1.5;margin:0 0 22px}
  .book-sub strong{color:var(--obsidian);font-weight:600}
  .cal-rule{
    border:0;height:1px;margin:0 0 6px;
    background:linear-gradient(90deg,var(--line) 0%,rgba(29,31,30,.08) 55%,rgba(29,31,30,0) 100%);
  }

  .card{background:#fff;border:1px solid var(--line-soft);border-radius:14px;padding:32px 28px}
  @media (max-width:600px){ .card{padding:24px 20px} }
  .card h1{margin-bottom:16px}
  .card p{color:var(--mocha);font-size:16px;line-height:1.62;margin:0 0 16px}
  .card strong{font-weight:600;color:var(--obsidian)}
  .rule{height:1px;background:var(--line-soft);margin:26px 0}

  #cal{width:100%;height:720px}
  #cal iframe{width:100%!important;height:100%!important;border:0;display:block}
  @media (max-width:640px){ #cal{height:1120px} }

  .testbar{
    flex:none;background:#33291A;color:#F0E2C2;border-radius:8px;
    padding:10px 14px;margin:0 0 16px;font-size:13px;line-height:1.5;
  }
  .testbar b{color:#E8C979;text-transform:uppercase;letter-spacing:.08em;font-size:11px}
  .testbar a{color:#E8C979}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div class="shell">
  <div id="testbar"></div>
  <div class="bar" id="bar"><i id="barfill"></i></div>
  <p class="steplabel" id="steplabel"></p>
  <div class="stage">
    <div id="screen" aria-live="polite"></div>
  </div>
</div>

<script>
(function(){
  'use strict';

  var FN = '/.netlify/functions/submit-qualify';
  var CALENDLY = 'https://calendly.com/jasonmoss/business-assessment-call';
  var LAUNCHPAD = 'https://jasonmoss.com/launchpad/';
  var TS_SITEKEY = '0x4AAAAAADlUEkeJ6kJ-_AML';
  var KEY = 'jm_qualify_v2';
  var SESSION_MAX_AGE = 30 * 60 * 1000;

  // Flag framing BEFORE the first measurement, so the viewport floor is off.
  var FRAMED = (function(){ try { return window.parent !== window; } catch(e){ return true; } })();
  if (FRAMED) document.documentElement.className += ' framed';

  var params = new URLSearchParams(location.search);
  function p(k){ return (params.get(k) || '').slice(0,120); }
  var SOURCE = p('source') || p('utm_source') || 'direct';
  var UTM = {
    utm_source: SOURCE, utm_medium: p('utm_medium'), utm_campaign: p('utm_campaign'),
    utm_content: p('utm_content'), utm_term: p('utm_term')
  };
  var TEST = p('test'), FORCE = p('force'), FORCE_REASON = p('reason') || 'early';

  var state = { revenue:null, fulltime:null, clients:null,
                first_name:'', email:'', decided:null, reason:null };
  var idx = 0, locked = false, keyHandler = null;
  function total(){ return localDecision().decision === 'book' ? 3 : 4; }

  var el = document.getElementById('screen');
  var bar = document.getElementById('bar');
  var barfill = document.getElementById('barfill');
  var steplabel = document.getElementById('steplabel');

  var QUESTIONS = [
    { id:'revenue', title:"Where's your business at right now?",
      sub:"There's no wrong answer — this just points you to the right next step.",
      options:[
        {v:'none',      t:"I haven't started earning yet"},
        {v:'under-1k',  t:'Under $1,000/month'},
        {v:'1k-5k',     t:'$1,000 – $5,000/month'},
        {v:'5k-10k',    t:'$5,000 – $10,000/month'},
        {v:'10k-plus',  t:'$10,000+/month'}
      ]},
    { id:'fulltime', title:'Is this your full-time focus?',
      options:[
        {v:'yes',       t:'Yes, this is what I do full-time'},
        {v:'job',       t:'Not yet — I have a job or other main income'},
        {v:'supported', t:"I'm retired or supported while I build it"}
      ]},
    { id:'clients', title:'How many paying clients do you have right now?',
      options:[
        {v:'none',   t:'None right now'},
        {v:'1-2',    t:'1 – 2'},
        {v:'3-5',    t:'3 – 5'},
        {v:'6-plus', t:'6 or more'}
      ]}
  ];

  // Where you are, what you need, what to do about it. Said the way you would
  // say it to someone across a table — no cleverness, no reframing.
  var DECLINE = {
    early: {
      h: "Let's get your first clients in first.",
      body: [
        "You're earlier than this call is built for. It's for people who already have clients coming in and need to fix what isn't working.",
        "What you need first is the basics — a clear offer, people to put it in front of, and knowing what to say when someone's interested. <strong>That's what Launchpad is.</strong> Start there, and book this call once you've got clients coming in."
      ]
    },
    part_time: {
      h: "The timing isn't right yet.",
      body: [
        "You're building this around another income, which is a different problem than the one this call solves.",
        "What you need is a way to get clients that fits the hours you've actually got. <strong>That's what Launchpad is for</strong> — it's self-paced, so you work it around the job. Get that running and going full-time stops being a leap."
      ]
    },
    no_clients: {
      h: "Let's fill the calendar first.",
      body: [
        "You're full-time with money coming in, which puts you ahead of most people who fill this out. But you're not working with anyone right now.",
        "That's the thing to fix, and it's bigger than a twenty-minute conversation — it's your offer, who you put it in front of, and how you handle it when someone's interested. <strong>Launchpad covers all three.</strong> Start there."
      ]
    }
  };

  function save(){
    try { sessionStorage.setItem(KEY, JSON.stringify({ s:state, i:idx, t:Date.now() })); } catch(e){}
  }
  function restore(){
    try {
      var d = JSON.parse(sessionStorage.getItem(KEY) || 'null');
      if (!d || !d.s) return false;
      if (Date.now() - (d.t || 0) > SESSION_MAX_AGE){ sessionStorage.removeItem(KEY); return false; }
      Object.keys(state).forEach(function(k){ if (d.s[k] != null) state[k] = d.s[k]; });
      // A "no" stands. You cannot re-answer your way into a yes.
      if (state.decided === 'decline'){ renderDecline(state.reason); return true; }
      idx = Math.min(typeof d.i === 'number' ? d.i : 0, 4);
      for (var q = 0; q < QUESTIONS.length; q++){
        if (!state[QUESTIONS[q].id]){ idx = Math.min(idx, q); break; }
      }
    } catch(e){}
    return false;
  }

  var lastH = 0;
  function height(){
    var h = Math.ceil(document.querySelector('.shell').getBoundingClientRect().height) + 8;
    if (h === lastH) return;
    lastH = h;
    try { parent.postMessage({ type:'qualify:height', height:h }, '*'); } catch(e){}
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function progress(step, show){
    bar.classList.toggle('hide', !show);
    var t = total();
    barfill.style.width = show ? Math.round((Math.min(step,t)/t)*100)+'%' : '0%';
    steplabel.textContent = show ? ('Step ' + Math.min(step,t) + ' of ' + t) : '';
  }
  function paint(html, step, showProgress){
    el.innerHTML = '<div class="screen">' + html + '</div>';
    progress(step, showProgress !== false);
    height();
    var f = el.querySelector('[data-focus]');
    if (f){ try { f.focus({preventScroll:true}); } catch(e){ f.focus(); } }
  }

  function renderQuestion(){
    var q = QUESTIONS[idx];
    var opts = q.options.map(function(o,i){
      var on = state[q.id] === o.v;
      return '<li><button type="button" class="opt'+(on?' on':'')+'" data-v="'+esc(o.v)+'"'+
             ' aria-pressed="'+(on?'true':'false')+'">'+
             '<span class="k" aria-hidden="true">'+String.fromCharCode(65+i)+'</span>'+
             '<span>'+esc(o.t)+'</span></button></li>';
    }).join('');
    paint(
      '<h1>'+esc(q.title)+'</h1>'+
      (q.sub ? '<p class="sub">'+esc(q.sub)+'</p>' : '')+
      '<ul class="opts" role="list">'+opts+'</ul>'+
      (idx>0 ? '<div class="actions"><button type="button" class="back" id="back">&larr; Back</button></div>' : ''),
      idx+1
    );
    el.querySelectorAll('.opt').forEach(function(b){
      b.addEventListener('click', function(){
        if (locked) return;
        locked = true;
        state[q.id] = b.getAttribute('data-v');
        el.querySelectorAll('.opt').forEach(function(x){
          x.classList.remove('on'); x.setAttribute('aria-pressed','false');
        });
        b.classList.add('on'); b.setAttribute('aria-pressed','true');
        setTimeout(next, 160);
      });
    });
    var back = document.getElementById('back');
    if (back) back.addEventListener('click', prev);
    keyHandler = function(e){
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      var t = e.target && e.target.tagName;
      if (t === 'INPUT' || t === 'TEXTAREA') return;
      var i = -1;
      if (/^[a-zA-Z]$/.test(e.key)) i = e.key.toUpperCase().charCodeAt(0) - 65;
      else if (/^[1-9]$/.test(e.key)) i = parseInt(e.key,10) - 1;
      var btns = el.querySelectorAll('.opt');
      if (i >= 0 && i < btns.length){ e.preventDefault(); btns[i].click(); }
    };
  }

  // Only reached on the decline path now.
  function renderContact(){
    paint(
      // They have answered three questions expecting a calendar next. This has
      // to prime that a tailored recommendation is coming — without promising
      // a call, and without announcing the no in a form heading.
      '<h1>One more thing.</h1>'+
      '<p class="sub">Then I’ll show you the best next step for where you are.</p>'+
      '<div class="field">'+
        '<label class="f" for="fn">First name</label>'+
        '<input type="text" id="fn" data-focus autocomplete="given-name" value="'+esc(state.first_name)+'">'+
      '</div>'+
      '<div class="field">'+
        '<label class="f" for="em">Email</label>'+
        '<input type="email" id="em" autocomplete="email" inputmode="email" value="'+esc(state.email)+'">'+
      '</div>'+
      '<div class="sr"><label for="website">Leave this empty</label>'+
      '<input type="text" id="website" name="website" tabindex="-1" autocomplete="off"></div>'+
      '<div class="ts-slot" id="ts-slot"></div>'+
      '<p class="err" id="err" role="alert"></p>'+
      '<div class="actions">'+
        '<button type="button" class="btn" id="go">Continue</button>'+
        '<button type="button" class="back" id="back">&larr; Back</button>'+
      '</div>'+
      '<p class="hint">I’ll also send my emails on getting clients. Unsubscribe anytime.</p>',
      4
    );
    document.getElementById('go').addEventListener('click', submit);
    document.getElementById('back').addEventListener('click', prev);
    document.getElementById('fn').addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); document.getElementById('em').focus(); }
    });
    document.getElementById('em').addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); submit(); }
    });
    mountTurnstile();
  }

  var tsWidgetId = null;
  function mountTurnstile(){
    var slot = document.getElementById('ts-slot');
    if (!slot) return;
    tsWidgetId = null;
    function render(){
      if (!window.turnstile || !document.getElementById('ts-slot')) return;
      try {
        tsWidgetId = window.turnstile.render(slot, {
          sitekey: TS_SITEKEY, theme:'light', size:'flexible',
          callback: function(){ slot.classList.remove('show'); height(); },
          'before-interactive-callback': function(){ slot.classList.add('show'); height(); },
          'error-callback': function(){ slot.classList.add('show'); height(); }
        });
      } catch(e){}
    }
    if (window.turnstile){ render(); return; }
    if (!document.getElementById('ts-script')){
      var sc = document.createElement('script');
      sc.id = 'ts-script';
      sc.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
      sc.async = true; sc.defer = true; sc.onload = render;
      document.head.appendChild(sc);
    } else {
      var n = 0, iv = setInterval(function(){
        if (window.turnstile || ++n > 40){ clearInterval(iv); render(); }
      }, 150);
    }
  }
  function tsToken(){
    try { return (tsWidgetId !== null && window.turnstile) ? window.turnstile.getResponse(tsWidgetId) : ''; }
    catch(e){ return ''; }
  }
  function ensureToken(cb){
    if (TEST && TEST !== '1') return cb(tsToken());
    var t = tsToken();
    if (t) return cb(t);
    var slot = document.getElementById('ts-slot');
    if (slot){ slot.classList.add('show'); height(); }
    var n = 0, iv = setInterval(function(){
      var tok = tsToken();
      if (tok || ++n > 20){ clearInterval(iv); cb(tok); }
    }, 200);
  }

  function next(){ idx++; route(); }
  function prev(){ if (idx > 0){ idx--; route(); } }
  function route(){
    keyHandler = null; locked = false;
    save();
    if (idx < QUESTIONS.length) return renderQuestion();
    // Past the questions the two paths diverge. Qualified people go straight
    // to the calendar — Calendly already asks for name, email and what they
    // want from the call, so asking here first is duplicated typing at the
    // exact moment they have decided to book. Declined people give us their
    // details instead, which is the only way they reach the downsell.
    if (localDecision().decision === 'book') return renderBooking();
    return renderContact();
  }
  document.addEventListener('keydown', function(e){ if (keyHandler && !locked) keyHandler(e); });

  function localDecision(){
    if (['1k-5k','5k-10k','10k-plus'].indexOf(state.revenue) === -1) return { decision:'decline', reason:'early' };
    if (state.fulltime !== 'yes') return { decision:'decline', reason:'part_time' };
    if (state.clients === 'none') return { decision:'decline', reason:'no_clients' };
    return { decision:'book', reason:null };
  }

  function submit(){
    for (var q = 0; q < QUESTIONS.length; q++){
      if (!state[QUESTIONS[q].id]){ idx = q; route(); return; }
    }
    var fn = document.getElementById('fn').value.trim();
    var em = document.getElementById('em').value.trim();
    var err = document.getElementById('err');
    var btn = document.getElementById('go');
    if (btn.disabled) return;
    if (!fn){ err.textContent = 'Please add your first name.'; document.getElementById('fn').focus(); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){
      err.textContent = 'That email doesn’t look right.'; document.getElementById('em').focus(); return;
    }
    err.textContent = '';
    state.first_name = fn; state.email = em;
    btn.disabled = true; btn.textContent = 'One moment…';

    ensureToken(function(tok){
      fetch(FN, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          revenue:state.revenue, fulltime:state.fulltime, clients:state.clients,
          first_name:fn, email:em, source:SOURCE,
          utm_source:UTM.utm_source, utm_medium:UTM.utm_medium, utm_campaign:UTM.utm_campaign,
          utm_content:UTM.utm_content, utm_term:UTM.utm_term,
          website: document.getElementById('website').value,
          turnstile_token: tok, test: TEST
        })
      })
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return {ok:r.ok, j:j}; }); })
      .then(function(res){
        if (!res.ok){
          if (res.j && res.j.error === 'Verification failed'){
            err.innerHTML = 'Verification didn’t go through. Try again, or '+
              '<a href="https://jasonmoss.com/qualify/?source='+encodeURIComponent(SOURCE)+
              '" target="_blank" rel="noopener">open this in a new tab</a>.';
            btn.disabled = false; btn.textContent = 'Continue';
            if (window.turnstile && tsWidgetId !== null){ try { window.turnstile.reset(tsWidgetId); } catch(e){} }
            return;
          }
          return finish(localDecision());
        }
        finish({ decision: res.j.decision || localDecision().decision, reason: res.j.reason });
      })
      .catch(function(){ finish(localDecision()); });
    });
  }

  function finish(res){
    state.decided = res.decision; state.reason = res.reason;
    save();
    if (res.decision === 'book') renderBooking(); else renderDecline(res.reason);
  }

  function renderDecline(reason){
    var d = DECLINE[reason] || DECLINE.early;
    paint(
      '<div class="card">'+
        '<h1>'+esc(d.h)+'</h1>'+
        d.body.map(function(x){ return '<p>'+x+'</p>'; }).join('')+
        '<div class="rule"></div>'+
        '<a class="btn" href="'+LAUNCHPAD+'?utm_source='+encodeURIComponent(SOURCE)+
          '&utm_medium=qualifier&utm_campaign=decline_'+encodeURIComponent(reason||'early')+
          '" target="_top" rel="noopener">See Launchpad &rarr;</a>'+
      '</div>',
      5, false
    );
  }

  function utmObject(){
    var map = { utm_source:'utmSource', utm_medium:'utmMedium', utm_campaign:'utmCampaign',
                utm_content:'utmContent', utm_term:'utmTerm' };
    var out = {};
    Object.keys(map).forEach(function(k){ if (UTM[k]) out[map[k]] = UTM[k]; });
    return out;
  }

  function renderBooking(){
    paint(
      '<div class="fit">'+
        '<p class="fit-badge"><span aria-hidden="true">&#10003;</span> You’re a fit</p>'+
        '<p class="fit-line">This call was built for you.</p>'+
        '<p class="fit-benefit">We’ll look at your business together and map your clearest path to more clients and income.</p>'+
      '</div>'+
      '<p class="next-step">Your next step</p>'+
      '<h1 class="book-h">Pick a time below.</h1>'+
      '<p class="book-sub">Twenty minutes, one to one with <strong>Jason</strong> — not a team member.</p>'+
      '<hr class="cal-rule">'+
      '<div id="cal"></div>',
      5, false
    );
    var url = CALENDLY +
      '?hide_gdpr_banner=1&background_color=F8F6F2&text_color=1D1F1E&primary_color=0E6B5A' +
      Object.keys(UTM).map(function(k){ return UTM[k] ? '&'+k+'='+encodeURIComponent(UTM[k]) : ''; }).join('');
    function init(){
      if (!window.Calendly) return;
      window.Calendly.initInlineWidget({
        url: url,
        parentElement: document.getElementById('cal'),
        utm: utmObject()
      });
      height();
    }
    if (window.Calendly) init();
    else {
      var s = document.createElement('script');
      s.src = 'https://assets.calendly.com/assets/external/widget.js';
      s.async = true; s.onload = init;
      document.head.appendChild(s);
    }
    setTimeout(height, 900); setTimeout(height, 2400);
  }

  window.addEventListener('message', function(e){
    if (e.origin !== 'https://calendly.com') return;
    if (!e.data || typeof e.data !== 'object') return;
    if (e.data.event !== 'calendly.event_scheduled') return;
    // On the booking path we never collected an email, so we hand Calendly's
    // invitee URI to the server, which looks up who booked and records them
    // in Kit along with the answers they gave here.
    var uri = '';
    try { uri = (e.data.payload && e.data.payload.invitee && e.data.payload.invitee.uri) || ''; } catch(err){}
    try {
      fetch(FN, { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          action:'booked', invitee_uri: uri, email: state.email || undefined,
          revenue: state.revenue, fulltime: state.fulltime, clients: state.clients,
          source: SOURCE, test: TEST
        }) });
    } catch(err){}
    try { parent.postMessage({ type:'qualify:booked', source:SOURCE }, '*'); } catch(err){}
  });

  if (TEST){
    var tb = document.getElementById('testbar');
    tb.className = 'testbar';
    tb.innerHTML = '<b>Test</b> — nothing is saved to your CRM. '+
      '<strong>Booking a time still creates a real Calendly event.</strong> Jump to: '+
      '<a href="?test='+encodeURIComponent(TEST)+'&force=book">booking</a> · '+
      '<a href="?test='+encodeURIComponent(TEST)+'&force=decline&reason=early">early</a> · '+
      '<a href="?test='+encodeURIComponent(TEST)+'&force=decline&reason=part_time">part-time</a> · '+
      '<a href="?test='+encodeURIComponent(TEST)+'&force=decline&reason=no_clients">no clients</a>';
  }

  window.addEventListener('resize', height);

  // Timers alone are not enough: on a narrow screen the first measurement can
  // land before webfonts settle, and nothing inside the frame resizes
  // afterwards, so the parent keeps a too-short iframe and clips the content.
  // Observe the shell instead and re-post whenever its box actually changes.
  if (window.ResizeObserver){
    try { new ResizeObserver(height).observe(document.querySelector('.shell')); } catch(e){}
  }
  if (document.fonts && document.fonts.ready && document.fonts.ready.then){
    document.fonts.ready.then(height).catch(function(){});
  }

  if (TEST && FORCE){
    state.first_name = state.first_name || 'Preview';
    state.email = state.email || 'preview@example.com';
    if (FORCE === 'book') renderBooking(); else renderDecline(FORCE_REASON);
  } else if (!restore()){
    route();
  }
  setTimeout(height, 400);
})();
</script>
</body>
</html>
